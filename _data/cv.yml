cv:
  name: Andrea Zingarofalo
  label: PhD Candidate in Quantum Information Theory
  email: andrea.zingarofalo@gmail.com
  location: Brussels, Belgium
  image: ""
  summary: >
    Theoretical physicist exploring how fundamental physical laws shape the limits of knowledge,
    communication, and computation. My current research focuses on device-independent and self-testing
    methods for certifying quantum resources, a crucial task for establishing trust and security in
    next-generation quantum technologies. Beyond quantum computing, I am also fascinated by AI and
    machine learning.

